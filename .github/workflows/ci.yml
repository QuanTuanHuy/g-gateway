name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - name: Install Revive
        run: go install github.com/mgechev/revive@v1.15.0
      - name: Check Go documentation
        run: |
          staticcheck -tests=false ./...
          revive -set_exit_status -config revive.toml -formatter default ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Test with race detector
        run: go test ./... -race -count=1
      - name: Build commands
        run: go build ./cmd/...
      - name: Build gateway image
        run: docker build --build-arg COMMAND=gateway-dp -t gateway-go:ci .
