user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    default_type application/octet-stream;

    server {
        listen 8080 reuseport;
        server_name _;

        location = /bytes/0 {
            alias /payloads/0.bin;
        }

        location = /bytes/1024 {
            alias /payloads/1024.bin;
        }

        location = /bytes/16384 {
            alias /payloads/16384.bin;
        }

        location = /bytes/65536 {
            alias /payloads/65536.bin;
        }
    }
}
