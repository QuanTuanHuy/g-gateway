name: g-gateway-bench

services:
  gateway-go:
    profiles: [go]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMMAND: gateway-dp
    command: [-config, /bench/generated/gateway.yaml]
    environment:
      GOMAXPROCS: "2"
    volumes:
      - ./generated:/bench/generated:ro
      - ./certs/generated:/certs:ro
    ports:
      - "18080:8080"
      - "18443:8443"
      - "127.0.0.1:19090:9090"
    cpus: "2.0"
    mem_limit: 1g
    stop_grace_period: 35s
    networks:
      benchmark:
        aliases: [gateway]

  apisix:
    profiles: [apisix]
    build:
      context: ${APISIX_SOURCE}
      dockerfile: ${GATEWAY_SOURCE}/bench/apisix/Dockerfile
      args:
        CODE_PATH: .
        ENTRYPOINT_PATH: ./docker/debian-dev/docker-entrypoint.sh
        INSTALL_BROTLI: ./docker/debian-dev/install-brotli.sh
    environment:
      APISIX_STAND_ALONE: "true"
      APISIX_WORKER_PROCESSES: "2"
    volumes:
      - ./generated/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs/generated:/certs:ro
    ports:
      - "18080:8080"
      - "18443:8443"
    cpus: "2.0"
    mem_limit: 1g
    stop_grace_period: 35s
    networks:
      benchmark:
        aliases: [gateway]

  upstream-correctness:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMMAND: test-upstream
    command: [-listen, ":8080"]
    networks: [benchmark]

  upstream-performance:
    image: nginx:1.31.3-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./payloads:/payloads:ro
    networks: [benchmark]

  wrk:
    profiles: [load]
    image: alpine:3.21.3
    command: ["true"]
    networks: [benchmark]

  h2load:
    profiles: [load]
    image: alpine:3.21.3
    command: ["true"]
    networks: [benchmark]

networks:
  benchmark:
    name: g-gateway-benchmark
