name: g-gateway-bench

services:
  gateway-go:
    profiles: [go]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMMAND: gateway-dp
    command: [-config, /bench/generated/gateway.yaml]
    environment:
      GOMAXPROCS: "2"
    volumes:
      - ./generated:/bench/generated:ro
      - ./certs/generated:/certs:ro
    ports:
      - "18080:8080"
      - "18443:8443"
      - "127.0.0.1:19090:9090"
    cpus: "2.0"
    mem_limit: 1g
    stop_grace_period: 35s
    networks:
      benchmark:
        aliases: [gateway]

  apisix:
    profiles: [apisix]
    build:
      context: ${APISIX_SOURCE}
      dockerfile: ${GATEWAY_SOURCE}/bench/apisix/Dockerfile
      args:
        CODE_PATH: .
        ENTRYPOINT_PATH: ./docker/debian-dev/docker-entrypoint.sh
        INSTALL_BROTLI: ./docker/debian-dev/install-brotli.sh
    environment:
      APISIX_STAND_ALONE: "true"
      APISIX_WORKER_PROCESSES: "2"
    volumes:
      - ./generated/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./certs/generated:/certs:ro
    ports:
      - "18080:8080"
      - "18443:8443"
    cpus: "2.0"
    mem_limit: 1g
    stop_grace_period: 35s
    networks:
      benchmark:
        aliases: [gateway]

  upstream-correctness:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        COMMAND: test-upstream
    command: [-listen, ":8080"]
    networks: [benchmark]

  upstream-performance:
    image: g-gateway-bench-upstream-performance
    build:
      context: .
      dockerfile: nginx/Dockerfile
    networks: [benchmark]

  wrk:
    profiles: [load]
    build:
      context: ./wrk
      dockerfile: Dockerfile
    volumes:
      - ./wrk/report.lua:/scripts/report.lua:ro
      - ${BENCH_RESULTS_DIR}:/results
    networks: [benchmark]

  h2load:
    profiles: [load]
    build:
      context: ./h2load
      dockerfile: Dockerfile
    volumes:
      - ${BENCH_RESULTS_DIR}:/results
    networks: [benchmark]

networks:
  benchmark:
    name: g-gateway-benchmark
